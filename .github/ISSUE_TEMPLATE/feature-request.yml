name: Feature request
description: Suggest an idea or a new tool
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the use case, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voice pipeline
        - Tools
        - Web UI
        - Configuration / deployment
        - Echo / protocol
        - Documentation
        - Other
