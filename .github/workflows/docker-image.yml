# Builds the production image ONCE per pull request and tests that exact
# digest. Nothing is rebuilt after testing: merging re-tags the same digest as
# :main (release.yml), and a release adds :X.Y.Z/:X.Y/:latest to it.
#
#   same-repo PR  → ghcr.io/<owner>/<repo>:pr-<N> :sha-<commit> :tree-<tree>
#                   (provenance mode=max, SBOM and a build attestation)
#   fork PR       → build only, loaded locally (a fork token cannot push)
#
# The job names `image` and `integration` are required checks on main.
name: Docker image

on:
  pull_request:
    branches: [main]

# A newer push to the same PR makes an older, still-running build pointless.
concurrency:
  group: image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Push and pull the PR image.
  packages: write
  # Keyless provenance attestation (same-repo PRs only; forks are skipped).
  attestations: write
  id-token: write

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tree: ${{ steps.tree.outputs.tree }}
      image: ${{ steps.image.outputs.name }}
      same_repo: ${{ steps.repo.outputs.same }}

    steps:
      # The PR head, not the merge ref: the tree hash of this commit is what
      # the squash merge of an up-to-date branch produces.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Decide whether this PR can push to ghcr
        id: repo
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute the git tree hash
        id: tree
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.repo.outputs.same == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io image names must be lowercase, and GitHub expressions have no
      # lower() function, so the shell lowercases "owner/repo".
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}
            type=raw,value=sha-${{ github.event.pull_request.head.sha }}
            type=raw,value=tree-${{ steps.tree.outputs.tree }}
          labels: |
            io.github.cortecho.pr=${{ github.event.pull_request.number }}
            io.github.cortecho.tree=${{ steps.tree.outputs.tree }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.repo.outputs.same == 'true' }}
          load: ${{ steps.repo.outputs.same != 'true' }}
          tags: ${{ steps.repo.outputs.same == 'true' && steps.meta.outputs.tags || format('cortecho:pr-{0}', github.event.pull_request.number) }}
          labels: ${{ steps.meta.outputs.labels }}
          # The docker exporter cannot carry attestations; forks build only.
          provenance: ${{ steps.repo.outputs.same == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ steps.repo.outputs.same == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print the image digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image: $IMAGE"
          if [[ -n "$DIGEST" ]]; then
            echo "Digest: $DIGEST"
            echo "Pull: $IMAGE@$DIGEST"
          else
            echo "Digest: (none: fork PR, build-only)"
          fi

      # Verifiable with: gh attestation verify oci://<image>@<digest> -R <repo>
      - name: Attest the pushed image
        if: steps.repo.outputs.same == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  integration:
    name: integration
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: needs.image.outputs.same_repo == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the fork image locally
        if: needs.image.outputs.same_repo != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          sbom: false
          tags: cortecho:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha

      - name: Resolve the tested image
        id: ref
        env:
          SAME: ${{ needs.image.outputs.same_repo }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$SAME" == "true" ]]; then
            ref="${IMAGE}@${DIGEST}"
            docker pull "$ref"
            # The tag must resolve to the digest the image job pushed: the lab
            # tests that digest or nothing.
            if ! docker inspect --format '{{json .RepoDigests}}' "$ref" | grep -q "${DIGEST#sha256:}"; then
              echo "::error::$ref does not resolve to $DIGEST"
              exit 1
            fi
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          else
            ref="cortecho:pr-${PR}"
            echo "digest=local:${ref}" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Testing image: $ref"

      - name: Run the integration lab against that image
        env:
          OPENAI_MODE: mock
          CORTECHO_IMAGE: ${{ steps.ref.outputs.ref }}
        run: bash onboarding/scripts/run.sh

      - name: Generate the image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.ref.outputs.ref }}
          format: spdx-json
          output-file: onboarding/out/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write the evidence summary and archive the report
        if: always()
        env:
          TREE: ${{ needs.image.outputs.tree }}
          DIGEST: ${{ steps.ref.outputs.digest }}
          IMAGE: ${{ steps.ref.outputs.ref }}
        run: |
          mkdir -p onboarding/out
          node onboarding/scripts/artifact.ts --out onboarding/out --image "$IMAGE" --digest "$DIGEST" --tree "$TREE"
          if [[ -d onboarding/out/report ]]; then
            (cd onboarding/out && zip -qr integration-report.zip report)
          fi

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-tree-${{ needs.image.outputs.tree }}
          path: |
            onboarding/out/digest.txt
            onboarding/out/evidence.html
            onboarding/out/integration-report.zip
            onboarding/out/results.json
            onboarding/out/junit.xml
            onboarding/out/sbom.spdx.json
            onboarding/out/summary.json
          retention-days: 30
          if-no-files-found: warn
