# Runs the quality gates from AGENTS.md on every push and pull request:
# typecheck, lint and unit tests, then the Playwright suite against a
# production build (the same single-port server that Docker ships).
# The job name `ci` is a required check on main: changing it changes the ruleset.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an older, still-running run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Only Chromium: every Playwright project uses "Desktop Chrome" with a
      # different viewport. --with-deps also installs the OS libraries it needs.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      # Traces of failed tests (playwright.config.ts: trace 'retain-on-failure').
      # Open one with `npx playwright show-trace <file>.zip`.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
